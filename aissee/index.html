<style>
  :root {
    --ink: #14213d;
    --paper: #ffffff;
    --cream: #f7f5f0;
    --accent: #14213d;
    --accent2: #b45309;
    --gold: #c99a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --success: #16a34a;
    --warn: #dc2626;
    --font-display: 'DM Serif Display', serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  html.lang-hi {
    --font-display: 'Noto Sans', 'DM Serif Display', serif;
    --font-body: 'Noto Sans', 'DM Sans', sans-serif;

  * { box-sizing: border-box; touch-action: manipulation; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-text-size-adjust: 100%;
  }
  .screen {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--paper);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 20px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
  }
  .brand h1 {
    font-family: var(--font-display);
    font-size: 22px;
    margin: 0 0 2px;
    color: var(--ink);
  }
  .brand p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  #lang-select {
    height: 44px;
    min-width: 44px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--paper);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 0 10px;
  }
  main { flex: 1; padding: 24px 20px 40px; }
  .tabs {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .tab-btn {
    flex: 1;
    height: 44px;
    border: none;
    background: var(--paper);
    color: var(--muted);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--ink);
    color: var(--paper);
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 4px;
    display: block;
  }
  input[type="email"], input[type="password"], input[type="tel"],
  input[type="date"], input[type="text"], select.form-select {
    width: 100%;
    height: 48px;
    font-size: 16px;
    font-family: var(--font-body);
    padding: 0 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .btn {
    height: 48px;
    border-radius: 8px;
    border: none;
    font-family: var(--font-body);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:disabled { background: var(--muted); cursor: not-allowed; }
  .btn-secondary {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 13px;
    margin: 4px 0;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  #google-btn-container { min-height: 44px; }
  .msg {
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 14px;
  }
  .msg-error { background: #fef2f2; color: var(--warn); }
  .msg-success { background: #f0fdf4; color: var(--success); }
  .account-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .account-card p { margin: 0 0 4px; font-size: 14px; }
  .account-card .email { font-weight: 700; font-family: var(--font-mono); font-size: 14px; word-break: break-all; }
  .whoami-result {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--cream);
    border-radius: 8px;
    padding: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 10px;
  }
  .field-error { color: var(--warn); font-size: 12px; margin-top: -8px; }
  .field-warning { color: var(--accent2); font-size: 12px; margin-top: -8px; }
  .setup-intro { font-size: 14px; color: var(--muted); margin: 0 0 16px; }
</style>

let state = {
  lang: 'hi',
  activeTab: 'signin',
  session: null,
  message: null,
  loading: false,
  whoamiResult: null,
  enrollmentChecked: false,
  enrollment: null,
  setupForm: { classEntry: 'class6', targetDate: '', mobileNumber: '', city: '', state: '' },
};

function todayISODate() {
  return new Date().toISOString().slice(0, 10);
}

function addDaysISO(isoDate, days) {
  const d = new Date(`${isoDate}T00:00:00Z`);
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function t(key) {
  return LANG[state.lang][key] || key;
}

function setLang(lang) {
  state.lang = lang;
  document.documentElement.lang = lang;
  document.documentElement.classList.toggle('lang-hi', lang === 'hi');
  syncNotoSans(lang);
  render();
}

function syncNotoSans(lang) {
  const existing = document.getElementById('font-noto');
  if (lang === 'hi' && !existing) {
    const link = document.createElement('link');
    link.id = 'font-noto';
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap';
    document.head.appendChild(link);
  } else if (lang !== 'hi' && existing) {
    existing.remove();
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderHeader() {
  return `
    <header>
      <div class="brand">
        <h1>${t('app_title')}</h1>
        <p>${t('tagline')}</p>
      </div>
      <select id="lang-select">
        <option value="hi" ${state.lang === 'hi' ? 'selected' : ''}>हिंदी</option>
        <option value="en" ${state.lang === 'en' ? 'selected' : ''}>English</option>
      </select>
    </header>
  `;
}

function renderMessage() {
  if (!state.message) return '';
  const cls = state.message.type === 'error' ? 'msg-error' : 'msg-success';
  return `<div class="msg ${cls}">${escapeHtml(state.message.text)}</div>`;
}

function renderAuthForm() {
  const isSignup = state.activeTab === 'signup';
  return `
    <div class="tabs">
      <button class="tab-btn ${state.activeTab === 'signin' ? 'active' : ''}" data-tab="signin">${t('tab_signin')}</button>
      <button class="tab-btn ${state.activeTab === 'signup' ? 'active' : ''}" data-tab="signup">${t('tab_signup')}</button>
    </div>
    ${renderMessage()}
    <form id="auth-form">
      <div>
        <label for="email">${t('email_label')}</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div>
        <label for="password">${t('password_label')}</label>
        <input type="password" id="password" name="password" required autocomplete="${isSignup ? 'new-password' : 'current-password'}" minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" ${state.loading ? 'disabled' : ''}>
        ${state.loading ? t('checking') : (isSignup ? t('signup_button') : t('signin_button'))}
      </button>
    </form>
    <div class="divider">${t('or_divider')}</div>
    <div id="google-btn-container"></div>
  `;
}

function renderWhoamiResult() {
  if (!state.whoamiResult) return '';
  return `<div class="whoami-result">${escapeHtml(state.whoamiResult)}</div>`;
}

function renderLoading() {
  return `<p>${t('checking')}</p>`;
}

function renderSetupForm() {
  const f = state.setupForm;
  const minDate = addDaysISO(todayISODate(), 1);
  const recommendedMinDate = addDaysISO(todayISODate(), MIN_SCHEDULE_DAYS);
  const isIntensive = f.targetDate && f.targetDate < recommendedMinDate;
  return `
    ${renderMessage()}
    <p class="setup-intro">${t('setup_intro')}</p>
    <form id="setup-form">
      <div>
        <label>${t('setup_class_label')}</label>
        <div class="tabs">
          <button type="button" class="tab-btn ${f.classEntry === 'class6' ? 'active' : ''}" data-class-entry="class6">${t('setup_class6')}</button>
          <button type="button" class="tab-btn ${f.classEntry === 'class9' ? 'active' : ''}" data-class-entry="class9">${t('setup_class9')}</button>
        </div>
      </div>
      <div>
        <label for="target-date">${t('setup_target_date_label')}</label>
        <input type="date" id="target-date" name="target-date" min="${minDate}" value="${f.targetDate}" required>
        ${isIntensive ? `<p class="field-warning">${t('setup_intensive_warning')}</p>` : ''}
      </div>
      <div>
        <label for="mobile">${t('setup_mobile_label')}</label>
        <input type="tel" id="mobile" name="mobile" inputmode="numeric" maxlength="10" placeholder="${t('setup_mobile_placeholder')}" value="${escapeHtml(f.mobileNumber)}" required>
      </div>
      <div>
        <label for="city">${t('setup_city_label')}</label>
        <input type="text" id="city" name="city" value="${escapeHtml(f.city)}" required>
      </div>
      <div>
        <label for="state">${t('setup_state_label')}</label>
        <select id="state" name="state" class="form-select" required>
          <option value="">${t('setup_state_placeholder')}</option>
          ${INDIA_STATES.map((s) => `<option value="${s}" ${f.state === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <button type="submit" class="btn btn-primary" ${state.loading ? 'disabled' : ''}>
        ${state.loading ? t('checking') : t('setup_submit_button')}
      </button>
    </form>
  `;
}

function renderAccount() {
  const email = state.session?.user?.email || '';
  const en = state.enrollment;
  return `
    ${renderMessage()}
    <div class="account-card">
      <p>${t('welcome_message')}</p>
      <p class="email">${escapeHtml(email)}</p>
    </div>
    <div class="account-card">
      <p>${t('enrolled_class_label')}: ${en.class_entry === 'class6' ? t('setup_class6') : t('setup_class9')}</p>
      <p>${t('enrolled_target_date_label')}: ${escapeHtml(en.target_date)}</p>
      <p>${t('enrolled_mobile_label')}: ${escapeHtml(en.mobile_number)}</p>
      <p>${t('enrolled_city_state_label')}: ${escapeHtml(en.city)}, ${escapeHtml(en.state)}</p>
    </div>
    <button id="whoami-btn" class="btn btn-secondary" ${state.loading ? 'disabled' : ''}>
      ${state.loading ? t('checking') : t('check_worker_button')}
    </button>
    ${renderWhoamiResult()}
    <button id="signout-btn" class="btn btn-primary" style="margin-top: 16px;">${t('signout_button')}</button>
  `;
}

function render() {
  const app = document.getElementById('app');
  let body;
  if (!state.session) {
    body = renderAuthForm();
  } else if (!state.enrollmentChecked) {
    body = renderLoading();
  } else if (!state.enrollment) {
    body = renderSetupForm();
  } else {
    body = renderAccount();
  }
  app.innerHTML = renderHeader() + '<main>' + body + '</main>';
  attachHandlers();
}

function attachHandlers() {
  document.getElementById('lang-select')?.addEventListener('change', (e) => setLang(e.target.value));

  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      state.message = null;
      render();
    });
  });

  document.getElementById('auth-form')?.addEventListener('submit', handleAuthSubmit);
  document.getElementById('signout-btn')?.addEventListener('click', handleSignOut);
  document.getElementById('whoami-btn')?.addEventListener('click', handleWhoami);

  document.getElementById('setup-form')?.addEventListener('submit', handleSetupSubmit);
  document.getElementById('setup-form')?.addEventListener('input', handleSetupFieldInput);
  document.querySelectorAll('[data-class-entry]').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.setupForm.classEntry = btn.dataset.classEntry;
      render();
    });
  });

  renderGoogleButton();
}

async function handleAuthSubmit(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  if (!email.includes('@')) {
    state.message = { type: 'error', text: t('error_email_required') };
    return render();
  }
  if (password.length < 6) {
    state.message = { type: 'error', text: t('error_password_length') };
    return render();
  }

  state.loading = true;
  state.message = null;
  render();

  const isSignup = state.activeTab === 'signup';
  const { data, error } = isSignup
    ? await supabase.auth.signUp({ email, password })
    : await supabase.auth.signInWithPassword({ email, password });

  state.loading = false;

  if (error) {
    state.message = { type: 'error', text: error.message || t('error_generic') };
    return render();
  }

  if (isSignup && !data.session) {
    state.message = { type: 'success', text: t('signup_success') };
    return render();
  }

  state.session = data.session;
  checkEnrollment();
}

let googleRawNonce = null;

async function generateNonce() {
  const rawNonce = crypto.randomUUID() + crypto.randomUUID();
  const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(rawNonce));
  const hashedNonce = Array.from(new Uint8Array(digest))
    .map((b) => b.toString(16).padStart(2, '0'))
    .join('');
  return { rawNonce, hashedNonce };
}

async function renderGoogleButton() {
  const container = document.getElementById('google-btn-container');
  if (!container || !window.google?.accounts?.id) return;

  const { rawNonce, hashedNonce } = await generateNonce();
  googleRawNonce = rawNonce;

  google.accounts.id.initialize({
    client_id: CONFIG.googleClientId,
    callback: handleGoogleCredentialResponse,
    nonce: hashedNonce,
    use_fedcm_for_prompt: true,
  });

  container.innerHTML = '';
  google.accounts.id.renderButton(container, {
    theme: 'outline',
    size: 'large',
    width: Math.min(400, Math.floor(container.clientWidth) || 300),
    text: 'continue_with',
    locale: state.lang === 'hi' ? 'hi' : 'en',
  });
}

async function handleGoogleCredentialResponse(response) {
  state.loading = true;
  state.message = null;
  render();

  const { data, error } = await supabase.auth.signInWithIdToken({
    provider: 'google',
    token: response.credential,
    nonce: googleRawNonce,
  });

  state.loading = false;

  if (error) {
    state.message = { type: 'error', text: error.message || t('error_generic') };
    return render();
  }

  state.session = data.session;
  checkEnrollment();
}

async function checkEnrollment() {
  state.loading = true;
  render();

  try {
    const res = await fetch(`${CONFIG.workerUrl}/enrollment`, {
      headers: { Authorization: `Bearer ${state.session?.access_token}` },
    });
    const body = await res.json();
    state.enrollment = body.enrolled ? body.enrollment : null;
  } catch {
    state.enrollment = null;
  }

  state.enrollmentChecked = true;
  state.loading = false;
  render();
}

function handleSetupFieldInput(e) {
  const f = state.setupForm;
  if (e.target.id === 'target-date') {
    f.targetDate = e.target.value;
    return render();
  }
  if (e.target.id === 'mobile') {
    f.mobileNumber = e.target.value;
  } else if (e.target.id === 'city') {
    f.city = e.target.value;
  } else if (e.target.id === 'state') {
    f.state = e.target.value;
  }
}

async function handleSetupSubmit(e) {
  e.preventDefault();
  const f = state.setupForm;

  if (!f.targetDate || f.targetDate <= todayISODate()) {
    state.message = { type: 'error', text: t('error_target_date') };
    return render();
  }
  if (!/^[6-9]\d{9}$/.test(f.mobileNumber)) {
    state.message = { type: 'error', text: t('error_invalid_mobile') };
    return render();
  }
  if (!f.city.trim()) {
    state.message = { type: 'error', text: t('error_invalid_city') };
    return render();
  }
  if (!INDIA_STATES.includes(f.state)) {
    state.message = { type: 'error', text: t('error_invalid_state') };
    return render();
  }

  state.loading = true;
  state.message = null;
  render();

  try {
    const res = await fetch(`${CONFIG.workerUrl}/enrollment`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${state.session?.access_token}`,
      },
      body: JSON.stringify({
        class_entry: f.classEntry,
        target_date: f.targetDate,
        mobile_number: f.mobileNumber,
        city: f.city.trim(),
        state: f.state,
      }),
    });
    const body = await res.json();

    if (!res.ok) {
      state.loading = false;
      state.message = { type: 'error', text: t('error_generic') };
      return render();
    }

    state.enrollment = body.enrollment;
  } catch {
    state.loading = false;
    state.message = { type: 'error', text: t('error_generic') };
    return render();
  }

  state.loading = false;
  render();
}

async function handleSignOut() {
  await supabase.auth.signOut();
  state.session = null;
  state.whoamiResult = null;
  state.enrollment = null;
  state.enrollmentChecked = false;
  state.activeTab = 'signin';
  render();
}

async function handleWhoami() {
  state.loading = true;
  state.whoamiResult = null;
  render();

  try {
    const token = state.session?.access_token;
    const res = await fetch(`${CONFIG.workerUrl}/whoami`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const body = await res.json();
    state.whoamiResult = `HTTP ${res.status}\n${JSON.stringify(body, null, 2)}`;
  } catch (err) {
    state.whoamiResult = `Request failed: ${err.message}`;
  }

  state.loading = false;
  render();
}

async function init() {
  document.documentElement.classList.toggle('lang-hi', state.lang === 'hi');
  syncNotoSans(state.lang);

  const { data } = await supabase.auth.getSession();
  state.session = data.session;
  if (state.session) {
    checkEnrollment();
  } else {
    render();
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (event === 'INITIAL_SESSION') return;
    state.session = session;
    if (session) {
      checkEnrollment();
    } else {
      render();
    }
  });
}

init();
</script>
